services:
  motivator:
    build: .
    image: ghcr.io/ahmedsaed/motivator_mcbot:latest
    container_name: motivator-mcbot
    env_file: .env
    environment:
      # Post once every 24h. Remove this to make the container post once and exit.
      POST_INTERVAL_SECONDS: "${POST_INTERVAL_SECONDS:-86400}"
    restart: unless-stopped
    volumes:
      # A named volume keeps the ownership the image sets, so the unprivileged
      # container user can write to it. A bind mount such as ./images:/app/images
      # would be created root-owned by Docker and the container could not write
      # there — see the README if you want the images on the host filesystem.
      - images:/app/images

volumes:
  images:
